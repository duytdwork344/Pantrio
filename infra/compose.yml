services:
  postgres:
    image: postgres:16-alpine
    container_name: pantrio-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pantrio
      POSTGRES_PASSWORD: pantrio
      POSTGRES_DB: pantrio
    volumes:
      - pantrio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantrio -d pantrio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pantrio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pantrio_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: pantrio-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: pantrio
      MINIO_ROOT_PASSWORD: pantriodev
    volumes:
      - pantrio_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: pantrio-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 pantrio pantriodev;
      mc mb -p local/pantrio-media || true;
      mc anonymous set download local/pantrio-media || true;
      exit 0;
      "

volumes:
  pantrio_postgres_data:
  pantrio_redis_data:
  pantrio_minio_data:
