<div class="shell">
  <header class="shell__header">
    <a routerLink="/" class="shell__brand" aria-label="Pantrio">
      <img src="/brand/logo.png" alt="" width="40" height="40" class="shell__logo" />
      <span class="shell__brand-text">{{ title }}</span>
    </a>
    <nav class="shell__nav">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        Discover
      </a>
      <a routerLink="/articles" routerLinkActive="is-active">Articles</a>
      @if (auth.canCreateArticle() || auth.canCreateRecipe()) {
        <a
          [routerLink]="auth.canCreateRecipe() ? '/studio/recipes' : '/studio/articles'"
          routerLinkActive="is-active"
        >
          Studio
        </a>
      }
      @if (auth.canModerate()) {
        <a routerLink="/moderation" routerLinkActive="is-active">Moderation</a>
      }
      @if (auth.isAuthenticated()) {
        <a routerLink="/me/nutrition" routerLinkActive="is-active">Dinh dưỡng</a>
        <span class="shell__user">{{ auth.user()?.displayName }}</span>
        <button type="button" class="shell__linkbtn" (click)="auth.logout()">
          Đăng xuất
        </button>
      } @else {
        <a routerLink="/login" routerLinkActive="is-active">Đăng nhập</a>
      }
    </nav>
  </header>

  <main class="shell__main">
    <router-outlet />
  </main>
</div>
