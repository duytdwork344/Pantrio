<section class="auth">
  <h1>Đăng ký</h1>
  <p class="auth__hint">Tạo tài khoản USER. Quyền Creator gán qua seed/admin.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="auth__form">
    <label>
      Tên hiển thị
      <input type="text" formControlName="displayName" autocomplete="name" />
    </label>
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <label>
      Mật khẩu (≥ 8 ký tự)
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>

    @if (error()) {
      <p class="auth__error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Đang tạo…' : 'Tạo tài khoản' }}
    </button>
  </form>

  <p class="auth__footer">
    Đã có tài khoản?
    <a routerLink="/login">Đăng nhập</a>
  </p>
</section>
